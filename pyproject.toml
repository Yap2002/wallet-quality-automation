[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-quality-project"
version = "0.1.0"
description = "A test-focused electronic wallet quality engineering project."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.116,<1.0",
    "PyMySQL>=1.1,<2.0",
    "pydantic>=2.8,<3.0",
    "redis>=5.0,<7.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
test = [
    "allure-pytest==2.16.0",
    "httpx>=0.28,<1.0",
    "hypothesis>=6.0,<7.0",
    "locust>=2.0,<3.0",
    "mypy>=1.11,<2.0",
    "pytest>=8.4,<9.0",
    "pytest-playwright>=0.7,<1.0",
    "pytest-xdist==3.8.0",
    "requests==2.34.2",
    "ruff>=0.12,<1.0",
    "types-requests==2.33.0.20260712",
    "types-PyYAML>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: requires a running MySQL database",
    "smoke: fast checks for critical service entry points",
    "regression: broader functional regression coverage",
    "performance: load and performance scenarios",
    "concurrency: concurrent consistency scenarios",
    "ui: browser-based user interface scenarios",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["app", "tests", "scripts"]
